topic: osi-tcpip
domain: 1
blueprint: "1.5"
cards:
  - id: osi-001
    front: "OSI layers 7 to 1?"
    back: "7 Application\n6 Presentation\n5 Session\n4 Transport\n3 Network\n2 Data Link\n1 Physical\n(All People Seem To Need Data Processing)"
  - id: osi-002
    front: "TCP/IP model layers and how they map to OSI?"
    back: "Application (OSI 5-7)\nTransport (4)\nInternet (3)\nNetwork Access / Link (1-2)"
  - id: osi-003
    front: "PDU name at layers 4, 3, 2, 1?"
    back: "4 Segment (TCP) / Datagram (UDP)\n3 Packet\n2 Frame\n1 Bits"
  - id: osi-004
    front: "TCP vs UDP: 4 key differences?"
    back: "TCP: connection-oriented (3-way handshake), reliable (acks, retransmit), ordered (sequence numbers), flow control (windowing).\nUDP: connectionless, no acks, no ordering, lower overhead."
  - id: osi-005
    front: "TCP 3-way handshake?"
    back: "SYN -> SYN-ACK -> ACK"
  - id: osi-006
    front: "How does TCP close a connection?"
    back: "4-way: FIN, ACK, FIN, ACK."
  - id: osi-007
    front: "Ports: FTP, SSH, Telnet, SMTP, DNS, HTTP, HTTPS?"
    back: "FTP 20/21 TCP\nSSH 22 TCP\nTelnet 23 TCP\nSMTP 25 TCP\nDNS 53 UDP and TCP\nHTTP 80 TCP\nHTTPS 443 TCP"
  - id: osi-008
    front: "Ports: DHCP, TFTP, NTP, SNMP, syslog?"
    back: "DHCP 67 server / 68 client UDP\nTFTP 69 UDP\nNTP 123 UDP\nSNMP 161 (agent) / 162 (traps) UDP\nSyslog 514 UDP"
  - id: osi-009
    front: "Ports: POP3, IMAP, RDP?"
    back: "POP3 110 TCP\nIMAP 143 TCP\nRDP 3389 TCP"
  - id: osi-010
    front: "Which apps prefer UDP and why?"
    back: "Voice, video, DNS queries, DHCP, TFTP, SNMP, syslog. Low delay matters more than retransmitting lost data."
  - id: osi-011
    front: "Well-known, registered and dynamic port ranges?"
    back: "Well-known 0-1023\nRegistered 1024-49151\nDynamic/ephemeral 49152-65535"
  - id: cab-001
    topic: cabling
    blueprint: "1.3"
    front: "Single-mode vs multimode fiber?"
    back: "Single-mode: thin core (~9 micron), laser, long distance (km).\nMultimode: wider core (50/62.5 micron), LED or VCSEL, shorter distance (hundreds of m), cheaper."
  - id: cab-002
    topic: cabling
    blueprint: "1.3"
    front: "Max length of a copper UTP Ethernet run?"
    back: "100 meters."
  - id: cab-003
    topic: cabling
    blueprint: "1.3"
    front: "Straight-through vs crossover: when is each used (without auto-MDIX)?"
    back: "Straight-through: unlike devices (PC to switch, router to switch).\nCrossover: like devices (switch to switch, PC to PC, router to router, PC to router).\nAuto-MDIX makes either work."
  - id: cab-004
    topic: cabling
    blueprint: "1.4"
    front: "Duplex mismatch symptoms?"
    back: "Slow link; late collisions on the half-duplex side; CRC/FCS errors and runts on the full-duplex side."
  - id: cab-005
    topic: cabling
    blueprint: "1.4"
    front: "What does a rising CRC/input error count suggest?"
    back: "Physical problems: bad cable, interference, bad connector, or a duplex mismatch."
  - id: cab-006
    topic: cabling
    blueprint: "1.4"
    front: "What are runts and giants?"
    back: "Runts: frames under 64 bytes (often collisions).\nGiants: frames over 1518 bytes (MTU mismatch or a bad NIC)."
  - id: cab-007
    topic: cabling
    blueprint: "1.4"
    front: "Interface shows 'up/down'. Meaning?"
    back: "Layer 1 is up but Layer 2 is down: e.g. encapsulation mismatch, keepalive problem, or err-disabled on the far side.\n'administratively down' means it is shut down."
  - id: cab-008
    topic: cabling
    blueprint: "1.3"
    front: "Shared media vs point-to-point Ethernet?"
    back: "Shared media (hubs, old coax): one collision domain, half duplex, CSMA/CD.\nPoint-to-point (switch port to one device): full duplex, no collisions."
