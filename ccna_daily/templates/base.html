<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css?v=2">
  <title>{% block title %}CCNA Daily{% endblock %}</title>
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">
      <img src="/static/icon.svg" alt="" width="28" height="28">
      <span>CCNA Daily</span>
    </a>
    <nav class="nav-desktop">
      <a href="/" class="{{ 'on' if nav in ('home','study') }}">Today</a>
      <a href="/extra" class="{{ 'on' if nav == 'extra' }}">Extra{% if not day_complete %} <span class="lock" aria-label="locked">&#128274;</span>{% endif %}</a>
      <a href="/stats" class="{{ 'on' if nav == 'stats' }}">Stats</a>
    </nav>
    <div class="streak {{ 'hot' if day_complete }}" title="Day streak">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M13.5 1s.7 2.6.7 4.7c0 2-1.3 3.6-3.3 3.6S7.5 7.7 7.5 5.7l.03-.36C5.55 7.7 4.3 10.8 4.3 14.1 4.3 18.5 7.8 22 12.2 22s7.9-3.5 7.9-7.9C20.1 8.8 17.6 4 13.5 1Zm-1.6 18c-1.6 0-2.9-1.2-2.9-2.8 0-1.5 1-2.5 2.6-2.8 1.6-.3 3.3-1.1 4.2-2.4.4 1.3.6 2.6.6 4 0 2.2-2 4-4.5 4Z"/></svg>
      <b>{{ streak }}</b>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <nav class="tabbar">
    <a href="/" class="{{ 'on' if nav in ('home','study') }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</a>
    <a href="/extra" class="{{ 'on' if nav == 'extra' }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.9L22 9.6l-5.5 4.8L18.2 22 12 18.3 5.8 22l1.7-7.6L2 9.6l7.1-.7z"/></svg>Extra</a>
    <a href="/stats" class="{{ 'on' if nav == 'stats' }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10zm6 0V4h3v16zm6 0v-7h3v7z"/></svg>Stats</a>
  </nav>
  <script src="/static/app.js?v=1" defer></script>
</body>
</html>
